<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1280" role="img" aria-labelledby="title description">
  <title id="title">Three phases of human and AI collaboration</title>
  <desc id="description">A vertical workflow showing planning around a shared ticket, parallel AI execution, human review, and human-controlled release gates.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0a0f19"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#284b67"/>
      <stop offset="1" stop-color="#1b334b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#9db2c8"/>
    </marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#7dd3b0"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .phase { fill: #f4f0e8; font-size: 28px; font-weight: 750; }
      .eyebrow { fill: #7dd3b0; font-size: 15px; font-weight: 750; letter-spacing: 2px; }
      .title { fill: #f4f0e8; font-size: 31px; font-weight: 750; }
      .card-title { fill: #f4f0e8; font-size: 21px; font-weight: 700; }
      .card-copy { fill: #b3c0ce; font-size: 16px; }
      .label { fill: #dce5ee; font-size: 15px; font-weight: 700; }
      .small { fill: #91a1b2; font-size: 14px; }
      .flow { fill: none; stroke: #9db2c8; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #7dd3b0; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#loop-arrow); }
    </style>
  </defs>

  <rect width="960" height="1280" rx="28" fill="url(#background)"/>
  <text x="48" y="48" class="sans eyebrow">THE TICKET IS THE INTERFACE</text>
  <text x="48" y="88" class="sans title">A durable loop from intent to evidence</text>

  <rect x="36" y="120" width="888" height="310" rx="22" fill="#131d2a" stroke="#2f4256" stroke-width="2"/>
  <circle cx="76" cy="164" r="22" fill="#7dd3b0"/>
  <text x="76" y="172" class="sans" fill="#10251e" font-size="22" font-weight="800" text-anchor="middle">1</text>
  <text x="112" y="173" class="sans phase">Shape the work</text>
  <text x="112" y="202" class="sans card-copy">Explore first. Refine scope, risk, MR boundaries, and manual gates.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="238" width="210" height="92" rx="16" fill="#202c3a" stroke="#46596e"/>
    <circle cx="100" cy="270" r="10" fill="#f5b96b"/>
    <text x="119" y="277" class="sans card-title">Human intent</text>
    <text x="96" y="307" class="sans card-copy">Goals · constraints · risk</text>

    <rect x="375" y="224" width="210" height="120" rx="18" fill="url(#ticket)" stroke="#5687ad" stroke-width="2"/>
    <text x="480" y="259" class="sans label" text-anchor="middle">WIP TICKET</text>
    <text x="480" y="290" class="sans card-title" text-anchor="middle">Shared state</text>
    <text x="480" y="318" class="sans card-copy" text-anchor="middle">Plan · gates · sequence</text>

    <rect x="678" y="238" width="210" height="92" rx="16" fill="#202c3a" stroke="#46596e"/>
    <circle cx="706" cy="270" r="10" fill="#8bb8f4"/>
    <text x="725" y="277" class="sans card-title">AI explores</text>
    <text x="702" y="307" class="sans card-copy">Code · docs · history</text>
  </g>

  <path d="M282 280h93" class="loop"/>
  <path d="M585 280h93" class="loop"/>
  <path d="M783 330c0 58-606 58-606 0" class="loop"/>
  <text x="480" y="385" class="sans small" text-anchor="middle">go back and forth until the decomposition is credible</text>

  <rect x="36" y="454" width="888" height="310" rx="22" fill="#131d2a" stroke="#2f4256" stroke-width="2"/>
  <circle cx="76" cy="498" r="22" fill="#7dd3b0"/>
  <text x="76" y="506" class="sans" fill="#10251e" font-size="22" font-weight="800" text-anchor="middle">2</text>
  <text x="112" y="507" class="sans phase">Execute</text>
  <text x="112" y="536" class="sans card-copy">Let the agent prepare reversible work in parallel.</text>

  <g filter="url(#shadow)">
    <rect x="78" y="575" width="214" height="104" rx="18" fill="url(#ticket)" stroke="#5687ad" stroke-width="2"/>
    <text x="185" y="612" class="sans card-title" text-anchor="middle">WIP ticket</text>
    <text x="185" y="642" class="sans card-copy" text-anchor="middle">Current truth</text>
    <text x="185" y="665" class="sans small" text-anchor="middle">ownership · dependencies</text>

    <rect x="370" y="565" width="174" height="96" rx="16" fill="#202c3a" stroke="#46596e"/>
    <text x="457" y="602" class="sans card-title" text-anchor="middle">Draft MR A</text>
    <text x="457" y="632" class="sans card-copy" text-anchor="middle">Code + tests</text>

    <rect x="570" y="565" width="174" height="96" rx="16" fill="#202c3a" stroke="#46596e"/>
    <text x="657" y="602" class="sans card-title" text-anchor="middle">Draft MR B</text>
    <text x="657" y="632" class="sans card-copy" text-anchor="middle">Config + docs</text>

    <rect x="370" y="686" width="374" height="58" rx="15" fill="#18232f" stroke="#3b5065"/>
    <text x="557" y="721" class="sans card-title" text-anchor="middle">Tests · CI · rendered plans · diff review</text>
  </g>

  <path d="M292 612h78" class="flow"/>
  <path d="M292 642c120 0 150-29 278-29" class="flow"/>
  <path d="M457 661v25" class="flow"/>
  <path d="M657 661v25" class="flow"/>
  <path d="M370 715c-58 0-66-22-78-48" class="loop"/>
  <text x="315" y="705" class="sans small" text-anchor="middle">update</text>

  <rect x="36" y="788" width="888" height="432" rx="22" fill="#131d2a" stroke="#2f4256" stroke-width="2"/>
  <circle cx="76" cy="832" r="22" fill="#7dd3b0"/>
  <text x="76" y="840" class="sans" fill="#10251e" font-size="22" font-weight="800" text-anchor="middle">3</text>
  <text x="112" y="841" class="sans phase">Review and steer</text>
  <text x="112" y="870" class="sans card-copy">Review the work. If the plan is wrong, reshape it.</text>

  <g filter="url(#shadow)">
    <rect x="104" y="912" width="220" height="90" rx="16" fill="#202c3a" stroke="#46596e"/>
    <circle cx="133" cy="944" r="10" fill="#f5b96b"/>
    <text x="152" y="951" class="sans card-title">Human review</text>
    <text x="128" y="981" class="sans card-copy">Questions + decisions</text>

    <rect x="636" y="912" width="220" height="90" rx="16" fill="#202c3a" stroke="#46596e"/>
    <circle cx="665" cy="944" r="10" fill="#8bb8f4"/>
    <text x="684" y="951" class="sans card-title">AI edits</text>
    <text x="660" y="981" class="sans card-copy">Code + ticket state</text>

    <rect x="338" y="1032" width="284" height="72" rx="17" fill="#382b23" stroke="#8c6649" stroke-width="2"/>
    <text x="480" y="1061" class="sans card-title" text-anchor="middle">Ready for human gates?</text>
    <text x="480" y="1087" class="sans card-copy" text-anchor="middle">If not, review or reshape</text>

    <rect x="150" y="1136" width="178" height="62" rx="15" fill="#2b2525" stroke="#765858"/>
    <text x="239" y="1164" class="sans label" text-anchor="middle">MERGE</text>
    <text x="239" y="1185" class="sans small" text-anchor="middle">human approval</text>

    <rect x="391" y="1136" width="178" height="62" rx="15" fill="#2b2525" stroke="#765858"/>
    <text x="480" y="1164" class="sans label" text-anchor="middle">DEPLOY</text>
    <text x="480" y="1185" class="sans small" text-anchor="middle">secrets + cutover</text>

    <rect x="632" y="1136" width="178" height="62" rx="15" fill="#2b2525" stroke="#765858"/>
    <text x="721" y="1164" class="sans label" text-anchor="middle">VALIDATE</text>
    <text x="721" y="1185" class="sans small" text-anchor="middle">real-world evidence</text>
  </g>

  <path d="M324 952h312" class="loop"/>
  <path d="M746 1002c0 34-532 34-532 0" class="loop"/>
  <text x="480" y="1023" class="sans small" text-anchor="middle">review loop</text>
  <path d="M480 1024v8" class="flow"/>
  <path d="M480 1104v32" class="flow"/>
  <path d="M480 1120c-120 0-180 0-241 16" class="flow"/>
  <path d="M480 1120c120 0 180 0 241 16" class="flow"/>
  <path d="M856 1035c55 0 52-770 31-796" class="loop"/>
  <text x="898" y="636" class="sans small" text-anchor="middle" transform="rotate(-90 898 636)">bad plan? return to Phase 1</text>

  <text x="48" y="1252" class="sans small">Dashed arrows are feedback loops. Release transitions stay human-controlled.</text>
</svg>
