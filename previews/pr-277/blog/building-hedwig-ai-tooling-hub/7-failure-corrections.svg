<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Four failure patterns and their engineering corrections</title>
  <desc id="desc">Broad access becomes scoped tools, polling becomes event streaming, generated artifacts become deterministic builders, and unlimited concurrency becomes bounded workspaces.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#56d6e5;font-size:18px;font-weight:800;letter-spacing:2px}.h{fill:#fff8e8;font-size:34px;font-weight:800}.n{fill:#fff8e8;font-size:22px;font-weight:800}.b{fill:#c9d6df;font-size:18px}.bad{fill:#f4ad62;font-size:18px;font-weight:800}.good{fill:#9bdb8f;font-size:18px;font-weight:800}</style>
  <rect width="800" height="1120" rx="28" fill="#091b2d"/><text x="48" y="58" class="k">FAILURE / CORRECTION</text><text x="48" y="105" class="h">Turn symptoms into constraints</text>
  <g transform="translate(48 150)"><rect width="704" height="200" rx="22" fill="#112b43" stroke="#31516b" stroke-width="2"/><text x="30" y="47" class="bad">TOO BROAD</text><text x="30" y="84" class="n">Every tool available everywhere</text><path d="M30 112h644" stroke="#31516b"/><text x="30" y="151" class="good">CORRECTION</text><text x="178" y="151" class="b">Agent-specific, explicit tool scopes</text></g>
  <g transform="translate(48 375)"><rect width="704" height="200" rx="22" fill="#112b43" stroke="#31516b" stroke-width="2"/><text x="30" y="47" class="bad">TOO OPAQUE</text><text x="30" y="84" class="n">Polling hides long-running progress</text><path d="M30 112h644" stroke="#31516b"/><text x="30" y="151" class="good">CORRECTION</text><text x="178" y="151" class="b">Stream lifecycle events and status</text></g>
  <g transform="translate(48 600)"><rect width="704" height="200" rx="22" fill="#112b43" stroke="#31516b" stroke-width="2"/><text x="30" y="47" class="bad">TOO GENERATIVE</text><text x="30" y="84" class="n">AI creates the entire artifact</text><path d="M30 112h644" stroke="#31516b"/><text x="30" y="151" class="good">CORRECTION</text><text x="178" y="151" class="b">Deterministic builder; AI analysis</text></g>
  <g transform="translate(48 825)"><rect width="704" height="200" rx="22" fill="#12334b" stroke="#f4ad62" stroke-width="2"/><text x="30" y="47" class="bad">TOO UNBOUNDED</text><text x="30" y="84" class="n">Parallel work outruns review</text><path d="M30 112h644" stroke="#31516b"/><text x="30" y="151" class="good">CORRECTION</text><text x="178" y="151" class="b">Limits, cancellation, cleanup, gates</text></g>
  <text x="400" y="1080" text-anchor="middle" class="b">The correction belongs in the system, not just the prompt.</text>
</svg>
