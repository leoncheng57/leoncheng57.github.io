<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Lifecycle for an AI application experiment</title>
  <desc id="desc">A fictional idea moves through a playground and evidence review, then either graduates to an owned product or is deliberately removed.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#56d6e5"/></marker></defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#56d6e5;font-size:18px;font-weight:800;letter-spacing:2px}.h{fill:#fff8e8;font-size:34px;font-weight:800}.n{fill:#fff8e8;font-size:24px;font-weight:800}.b{fill:#c9d6df;font-size:19px}.dark{fill:#0b2239;font-size:20px;font-weight:800}</style>
  <rect width="800" height="1080" rx="28" fill="#091b2d"/><text x="48" y="58" class="k">EXPERIMENT LIFECYCLE</text><text x="48" y="105" class="h">Make graduation a decision</text>
  <rect x="150" y="155" width="500" height="118" rx="20" fill="#112b43" stroke="#31516b" stroke-width="2"/><text x="400" y="203" text-anchor="middle" class="n">1. Frame one hypothesis</text><text x="400" y="241" text-anchor="middle" class="b">Name the user, job, and stopping rule.</text>
  <path d="M400 273v52" stroke="#56d6e5" stroke-width="4" marker-end="url(#a)"/>
  <rect x="150" y="335" width="500" height="118" rx="20" fill="#112b43" stroke="#31516b" stroke-width="2"/><text x="400" y="383" text-anchor="middle" class="n">2. Run in a playground</text><text x="400" y="421" text-anchor="middle" class="b">Reuse foundations; avoid product claims.</text>
  <path d="M400 453v52" stroke="#56d6e5" stroke-width="4" marker-end="url(#a)"/>
  <rect x="150" y="515" width="500" height="138" rx="20" fill="#12334b" stroke="#56d6e5" stroke-width="2"/><text x="400" y="563" text-anchor="middle" class="n">3. Review evidence</text><text x="400" y="601" text-anchor="middle" class="b">Repeat use? Accepted outcomes?</text><text x="400" y="632" text-anchor="middle" class="b">Named owner? Safe operating path?</text>
  <path d="M400 653v58M400 711H220v60M400 711h180v60" fill="none" stroke="#56d6e5" stroke-width="4" marker-end="url(#a)"/>
  <rect x="48" y="781" width="330" height="180" rx="22" fill="#163c36" stroke="#9bdb8f" stroke-width="2"/><text x="213" y="831" text-anchor="middle" class="n">Graduate</text><text x="213" y="872" text-anchor="middle" class="b">Owner + support</text><text x="213" y="906" text-anchor="middle" class="b">Product checks</text><text x="213" y="940" text-anchor="middle" class="b">Maintained release</text>
  <rect x="422" y="781" width="330" height="180" rx="22" fill="#3a2b26" stroke="#f4ad62" stroke-width="2"/><text x="587" y="831" text-anchor="middle" class="n">Retire</text><text x="587" y="872" text-anchor="middle" class="b">Record the lesson</text><text x="587" y="906" text-anchor="middle" class="b">Remove the surface</text><text x="587" y="940" text-anchor="middle" class="b">End maintenance</text>
  <text x="400" y="1024" text-anchor="middle" class="b">Both outcomes protect platform coherence.</text>
</svg>
