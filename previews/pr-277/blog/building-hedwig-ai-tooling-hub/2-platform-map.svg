<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Map of focused applications on shared platform foundations</title>
  <desc id="desc">Six fictional application cards sit above shared agent, integration, interface, identity, observability, and release foundations.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#56d6e5;font-size:18px;font-weight:800;letter-spacing:2px}.h{fill:#fff8e8;font-size:34px;font-weight:800}.n{fill:#fff8e8;font-size:22px;font-weight:750}.b{fill:#c9d6df;font-size:18px}.s{fill:#0b2239;font-size:19px;font-weight:800}</style>
  <rect width="800" height="1040" rx="28" fill="#091b2d"/><text x="48" y="58" class="k">PLATFORM MAP</text><text x="48" y="105" class="h">Focused tools, common foundations</text>
  <text x="48" y="151" class="b">Each fictional tool keeps its own purpose and success test.</text>
  <g fill="#112b43" stroke="#31516b" stroke-width="2">
    <rect x="48" y="190" width="338" height="120" rx="18"/><rect x="414" y="190" width="338" height="120" rx="18"/>
    <rect x="48" y="334" width="338" height="120" rx="18"/><rect x="414" y="334" width="338" height="120" rx="18"/>
    <rect x="48" y="478" width="338" height="120" rx="18"/><rect x="414" y="478" width="338" height="120" rx="18"/>
  </g>
  <g class="n"><text x="76" y="235">Signal desk</text><text x="442" y="235">Workspace runner</text><text x="76" y="379">API guide</text><text x="442" y="379">Data helper</text><text x="76" y="523">Query companion</text><text x="442" y="523">Message builder</text></g>
  <g class="b"><text x="76" y="275">Review an event</text><text x="442" y="275">Prepare a draft</text><text x="76" y="419">Explain a request</text><text x="442" y="419">Shape a dataset</text><text x="76" y="563">Explore safely</text><text x="442" y="563">Compose a workflow</text></g>
  <path d="M400 620v48" stroke="#56d6e5" stroke-width="4"/><circle cx="400" cy="681" r="13" fill="#56d6e5"/>
  <rect x="48" y="710" width="704" height="118" rx="20" fill="#12334b" stroke="#56d6e5" stroke-width="2"/>
  <text x="76" y="754" class="k">SHARED APPLICATION PLATFORM</text><text x="76" y="795" class="n">Agents / tools / integrations / interface</text>
  <rect x="48" y="850" width="704" height="130" rx="20" fill="#f4ad62"/>
  <text x="76" y="897" class="s">FOUNDATIONS</text><text x="76" y="940" class="s">Identity / policy / records / releases</text>
  <text x="400" y="1015" text-anchor="middle" class="b">Fictional examples, not an internal product map.</text>
</svg>
