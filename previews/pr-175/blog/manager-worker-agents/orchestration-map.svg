<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
  <title id="title">Manager and worker coding-agent architecture</title>
  <desc id="description">A human plans with one manager session. The manager coordinates five workers, each with an isolated worktree and cmux workspace. Workers return draft pull requests and evidence for manager review before the human merge gate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#080d16"/>
    </linearGradient>
    <linearGradient id="manager" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#284d69"/>
      <stop offset="1" stop-color="#1b334b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#8ea6ba"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #7dd3b0; font-size: 15px; font-weight: 750; letter-spacing: 2px; }
      .heading { fill: #f4f0e8; font-size: 30px; font-weight: 760; }
      .label { fill: #f4f0e8; font-size: 19px; font-weight: 720; }
      .copy { fill: #afbdca; font-size: 14px; }
      .tiny { fill: #899aab; font-size: 12px; }
      .flow { fill: none; stroke: #8ea6ba; stroke-width: 2.5; marker-end: url(#arrow); }
      .return { fill: none; stroke: #7dd3b0; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="650" rx="28" fill="url(#background)"/>
  <text x="42" y="48" class="sans eyebrow">PARALLEL AGENT DELIVERY</text>
  <text x="42" y="87" class="sans heading">One coordination loop, five isolated execution loops</text>

  <rect x="42" y="121" width="190" height="92" rx="17" fill="#302720" stroke="#9c714a" stroke-width="2"/>
  <circle cx="75" cy="154" r="11" fill="#f5b96b"/>
  <text x="98" y="161" class="sans label">Human</text>
  <text x="65" y="190" class="sans copy">Intent + merge gate</text>

  <rect x="333" y="111" width="334" height="112" rx="20" fill="url(#manager)" stroke="#5e91b8" stroke-width="2"/>
  <text x="500" y="151" class="sans eyebrow" text-anchor="middle">MANAGER SESSION</text>
  <text x="500" y="181" class="sans label" text-anchor="middle">Plan, launch, monitor, review</text>
  <text x="500" y="205" class="sans copy" text-anchor="middle">Global task graph; no feature implementation</text>

  <rect x="768" y="121" width="190" height="92" rx="17" fill="#2b2525" stroke="#765858" stroke-width="2"/>
  <text x="863" y="158" class="sans label" text-anchor="middle">Human gate</text>
  <text x="863" y="187" class="sans copy" text-anchor="middle">Review + merge</text>

  <path d="M232 167h101" class="flow"/>
  <path d="M667 167h101" class="flow"/>
  <text x="282" y="151" class="sans tiny" text-anchor="middle">plan</text>
  <text x="718" y="151" class="sans tiny" text-anchor="middle">ready work</text>

  <path d="M500 223v45" stroke="#8ea6ba" stroke-width="2.5" fill="none"/>
  <path d="M126 268h748" stroke="#8ea6ba" stroke-width="2.5" fill="none"/>

  <g>
    <path d="M126 268v45" class="flow"/>
    <rect x="46" y="316" width="160" height="174" rx="18" fill="#172435" stroke="#3e5a73" stroke-width="2"/>
    <circle cx="74" cy="348" r="9" fill="#8bb8f4"/>
    <text x="93" y="355" class="sans label">Worker 149</text>
    <text x="66" y="383" class="sans copy">Station PWAs</text>
    <rect x="66" y="405" width="120" height="30" rx="8" fill="#233449"/>
    <text x="126" y="425" class="sans tiny" text-anchor="middle">Git worktree</text>
    <rect x="66" y="445" width="120" height="30" rx="8" fill="#233449"/>
    <text x="126" y="465" class="sans tiny" text-anchor="middle">cmux workspace</text>
  </g>

  <g>
    <path d="M313 268v45" class="flow"/>
    <rect x="233" y="316" width="160" height="174" rx="18" fill="#172435" stroke="#3e5a73" stroke-width="2"/>
    <circle cx="261" cy="348" r="9" fill="#8bb8f4"/>
    <text x="280" y="355" class="sans label">Worker 150</text>
    <text x="253" y="383" class="sans copy">Walkthroughs</text>
    <rect x="253" y="405" width="120" height="30" rx="8" fill="#233449"/>
    <text x="313" y="425" class="sans tiny" text-anchor="middle">Git worktree</text>
    <rect x="253" y="445" width="120" height="30" rx="8" fill="#233449"/>
    <text x="313" y="465" class="sans tiny" text-anchor="middle">cmux workspace</text>
  </g>

  <g>
    <path d="M500 268v45" class="flow"/>
    <rect x="420" y="316" width="160" height="174" rx="18" fill="#172435" stroke="#3e5a73" stroke-width="2"/>
    <circle cx="448" cy="348" r="9" fill="#8bb8f4"/>
    <text x="467" y="355" class="sans label">Worker 151</text>
    <text x="440" y="383" class="sans copy">Install modal</text>
    <rect x="440" y="405" width="120" height="30" rx="8" fill="#233449"/>
    <text x="500" y="425" class="sans tiny" text-anchor="middle">Git worktree</text>
    <rect x="440" y="445" width="120" height="30" rx="8" fill="#233449"/>
    <text x="500" y="465" class="sans tiny" text-anchor="middle">cmux workspace</text>
  </g>

  <g>
    <path d="M687 268v45" class="flow"/>
    <rect x="607" y="316" width="160" height="174" rx="18" fill="#172435" stroke="#3e5a73" stroke-width="2"/>
    <circle cx="635" cy="348" r="9" fill="#8bb8f4"/>
    <text x="654" y="355" class="sans label">Worker 152</text>
    <text x="627" y="383" class="sans copy">Feedback flow</text>
    <rect x="627" y="405" width="120" height="30" rx="8" fill="#233449"/>
    <text x="687" y="425" class="sans tiny" text-anchor="middle">Git worktree</text>
    <rect x="627" y="445" width="120" height="30" rx="8" fill="#233449"/>
    <text x="687" y="465" class="sans tiny" text-anchor="middle">cmux workspace</text>
  </g>

  <g>
    <path d="M874 268v45" class="flow"/>
    <rect x="794" y="316" width="160" height="174" rx="18" fill="#172435" stroke="#3e5a73" stroke-width="2"/>
    <circle cx="822" cy="348" r="9" fill="#8bb8f4"/>
    <text x="841" y="355" class="sans label">Worker 153</text>
    <text x="814" y="383" class="sans copy">Return links</text>
    <rect x="814" y="405" width="120" height="30" rx="8" fill="#233449"/>
    <text x="874" y="425" class="sans tiny" text-anchor="middle">Git worktree</text>
    <rect x="814" y="445" width="120" height="30" rx="8" fill="#233449"/>
    <text x="874" y="465" class="sans tiny" text-anchor="middle">cmux workspace</text>
  </g>

  <rect x="240" y="545" width="520" height="62" rx="16" fill="#15332e" stroke="#4f9b82" stroke-width="2"/>
  <text x="500" y="572" class="sans label" text-anchor="middle">Draft PR + commits + tests + screenshots + risks</text>
  <text x="500" y="594" class="sans copy" text-anchor="middle">Durable worker handoff for manager review</text>

  <path d="M126 490v44h374v11" class="return"/>
  <path d="M313 490v32h187v23" class="return"/>
  <path d="M500 490v55" class="return"/>
  <path d="M687 490v32H500v23" class="return"/>
  <path d="M874 490v44H500v11" class="return"/>
  <path d="M240 576H190V244H430V223" class="return"/>

  <text x="42" y="630" class="sans tiny">Workers execute independently. The manager reviews and coordinates. The human retains merge authority.</text>
</svg>
