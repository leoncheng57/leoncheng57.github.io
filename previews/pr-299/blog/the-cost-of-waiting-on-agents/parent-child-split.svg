<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, system-ui, sans-serif" style="background:#1a1b26">
  <defs>
    <marker id="handoff-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7aa2f7" />
    </marker>
    <marker id="notify-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e0af68" />
    </marker>
  </defs>

  <!-- Top band: hands off the long task, parent -> child. Kept in its own
       row above both boxes (not squeezed into the gap between them) so the
       label always has the full canvas width to lay out in, regardless of
       how close together the two boxes are. -->
  <path d="M 300,118 C 340,92 420,92 460,118" fill="none" stroke="#7aa2f7" stroke-width="2.5" marker-end="url(#handoff-arrow)" />
  <text x="380" y="78" text-anchor="middle" font-size="12" fill="#7aa2f7">hands off the long task</text>

  <!-- Parent session (left) -->
  <rect x="40" y="110" width="300" height="160" rx="12" fill="#1f2a44" stroke="#7aa2f7" stroke-width="2.5" />
  <text x="65" y="148" font-size="17" font-weight="700" fill="#7aa2f7" letter-spacing="0.5">PARENT SESSION</text>
  <text x="65" y="178" font-size="13.5" fill="#c0caf5">fast model</text>
  <text x="65" y="202" font-size="13.5" fill="#c0caf5">always free to answer</text>
  <text x="65" y="226" font-size="13.5" fill="#c0caf5">handles "quick questions" only</text>

  <!-- Background child agent (right) -->
  <rect x="420" y="110" width="300" height="160" rx="12" fill="#4a3820" stroke="#e0af68" stroke-width="2.5" />
  <text x="445" y="142" font-size="17" font-weight="700" fill="#e0af68" letter-spacing="0.5">BACKGROUND</text>
  <text x="445" y="162" font-size="17" font-weight="700" fill="#e0af68" letter-spacing="0.5">CHILD AGENT</text>
  <text x="445" y="190" font-size="13.5" fill="#c0caf5">heavier model</text>
  <text x="445" y="214" font-size="13.5" fill="#c0caf5">the long thing: refactor,</text>
  <text x="445" y="234" font-size="13.5" fill="#c0caf5">migration, multi-file change</text>

  <!-- Bottom band: notifies when it needs you, child -> parent -->
  <path d="M 460,264 C 420,290 340,290 300,264" fill="none" stroke="#e0af68" stroke-width="2.5" marker-end="url(#notify-arrow)" />
  <text x="380" y="310" text-anchor="middle" font-size="12" fill="#e0af68">notifies when it needs you</text>
</svg>
