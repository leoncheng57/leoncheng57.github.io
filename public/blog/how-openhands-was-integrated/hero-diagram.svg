<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220" style="background:#1a1b26">
  <defs>
    <marker id="arrow-h" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#565f89" />
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#a9b1d6">OpenHands integration — from laptop experiment to deployed service</text>

  <!-- Phase 1: Local eval -->
  <rect x="22" y="70" width="118" height="76" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2" />
  <text x="81" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Local eval</text>
  <text x="81" y="115" text-anchor="middle" font-size="9" fill="#93c5fd">Docker + REST setup</text>
  <text x="81" y="130" text-anchor="middle" font-size="9" fill="#93c5fd">~7 min / $2.81 a run</text>

  <line x1="140" y1="108" x2="160" y2="108" stroke="#565f89" stroke-width="2" marker-end="url(#arrow-h)" />

  <!-- Phase 2: Shared deployment -->
  <rect x="162" y="70" width="118" height="76" rx="8" fill="#1e3b2f" stroke="#4ade80" stroke-width="2" />
  <text x="221" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Shared deploy</text>
  <text x="221" y="115" text-anchor="middle" font-size="9" fill="#86efac">StatefulSet + PVC</text>
  <text x="221" y="130" text-anchor="middle" font-size="9" fill="#86efac">oauth2-proxy tenancy</text>

  <line x1="280" y1="108" x2="300" y2="108" stroke="#565f89" stroke-width="2" marker-end="url(#arrow-h)" />

  <!-- Phase 3: Native UI + BFF -->
  <rect x="302" y="70" width="118" height="76" rx="8" fill="#3b2f1e" stroke="#fbbf24" stroke-width="2" />
  <text x="361" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Native UI + BFF</text>
  <text x="361" y="115" text-anchor="middle" font-size="9" fill="#fcd34d">key stays server-side</text>
  <text x="361" y="130" text-anchor="middle" font-size="9" fill="#fcd34d">per-session workspaces</text>

  <line x1="420" y1="108" x2="440" y2="108" stroke="#565f89" stroke-width="2" marker-end="url(#arrow-h)" />

  <!-- Phase 4: Capacity & cleanup -->
  <rect x="442" y="70" width="118" height="76" rx="8" fill="#3b1e2f" stroke="#f472b6" stroke-width="2" />
  <text x="501" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Capacity</text>
  <text x="501" y="115" text-anchor="middle" font-size="9" fill="#f9a8d4">20Gi → 200Gi disk</text>
  <text x="501" y="130" text-anchor="middle" font-size="9" fill="#f9a8d4">janitor sidecar</text>

  <line x1="560" y1="108" x2="580" y2="108" stroke="#565f89" stroke-width="2" marker-end="url(#arrow-h)" />

  <!-- Phase 5: Polish -->
  <rect x="582" y="70" width="96" height="76" rx="8" fill="#2a1e3b" stroke="#a78bfa" stroke-width="2" />
  <text x="630" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Polish</text>
  <text x="630" y="115" text-anchor="middle" font-size="9" fill="#c4b5fd">model switching</text>
  <text x="630" y="130" text-anchor="middle" font-size="9" fill="#c4b5fd">CLI, disk bar</text>

  <!-- Footer -->
  <text x="350" y="190" text-anchor="middle" font-size="11" fill="#565f89">each phase justified the next — the $3-per-task evaluation came before any infrastructure spend</text>
</svg>
