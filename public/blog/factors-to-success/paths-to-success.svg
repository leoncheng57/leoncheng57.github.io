<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Inter, system-ui, sans-serif" style="background:#1a1b26">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a9b1d6" />
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#c0caf5">Four ways out of the same starting dot</text>

  <!-- goal -->
  <rect x="640" y="300" width="140" height="70" rx="10" fill="#24283b" stroke="#9ece6a" stroke-width="2" />
  <text x="710" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#9ece6a">Lasting success,</text>
  <text x="710" y="342" text-anchor="middle" font-size="13" fill="#9ece6a">habits and</text>
  <text x="710" y="360" text-anchor="middle" font-size="13" fill="#9ece6a">resources</text>

  <!-- hard work, wrong path: climbs and never turns toward the goal -->
  <path d="M90 380 C 100 330, 70 300, 95 260 S 80 190, 105 150 S 90 100, 120 70" fill="none" stroke="#f7768e" stroke-width="3" marker-end="url(#arrow)" />
  <text x="132" y="74" font-size="14" fill="#f7768e">Hard work, wrong path</text>
  <text x="132" y="92" font-size="12" fill="#a9b1d6">lots of effort, heading away from the goal</text>

  <!-- hard work, found the right path: climbs, loops back, then runs to the goal -->
  <path d="M90 380 C 150 330, 160 260, 200 220 S 250 140, 300 150 S 330 220, 320 280 S 330 320, 400 318 S 560 322, 636 325" fill="none" stroke="#e0af68" stroke-width="3" marker-end="url(#arrow)" />
  <text x="345" y="128" font-size="14" fill="#e0af68">Hard work, found the right path</text>
  <text x="345" y="146" font-size="12" fill="#a9b1d6">a detour, then a turn toward the goal</text>

  <!-- steady line straight to the goal -->
  <path d="M90 380 C 250 360, 450 350, 636 345" fill="none" stroke="#7aa2f7" stroke-width="3" marker-end="url(#arrow)" />

  <!-- small work, right path: right direction, stops early -->
  <path d="M90 380 C 150 400, 220 410, 290 405" fill="none" stroke="#bb9af7" stroke-width="3" />
  <circle cx="290" cy="405" r="4" fill="#bb9af7" />
  <text x="300" y="410" font-size="14" fill="#bb9af7">Small work, right path</text>

  <!-- luck and chance: dotted arc underneath -->
  <path d="M90 385 Q 300 520, 690 372" fill="none" stroke="#7dcfff" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round" />
  <text x="300" y="472" font-size="14" fill="#7dcfff">Luck and chance</text>

  <!-- start -->
  <circle cx="90" cy="380" r="8" fill="#c0caf5" />
  <text x="70" y="404" text-anchor="middle" font-size="12" fill="#a9b1d6">start</text>
</svg>
