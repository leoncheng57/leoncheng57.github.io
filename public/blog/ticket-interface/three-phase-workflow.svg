<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" role="img" aria-labelledby="title description">
  <title id="title">Three phases of human and AI collaboration</title>
  <desc id="description">Three simple rows show planning around a shared ticket, AI execution with draft merge requests, and human review followed by release gates.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0a0f19"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#284b67"/>
      <stop offset="1" stop-color="#1b334b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#9db2c8"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #7dd3b0; font-size: 14px; font-weight: 750; letter-spacing: 2px; }
      .diagram-title { fill: #f4f0e8; font-size: 29px; font-weight: 750; }
      .phase-title { fill: #f4f0e8; font-size: 27px; font-weight: 750; }
      .phase-copy { fill: #aebdcb; font-size: 16px; }
      .card-title { fill: #f4f0e8; font-size: 20px; font-weight: 700; }
      .card-copy { fill: #b4c1ce; font-size: 15px; }
      .gate-title { fill: #f4f0e8; font-size: 16px; font-weight: 700; }
      .note { fill: #8fa1b2; font-size: 14px; }
      .flow { fill: none; stroke: #9db2c8; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="800" height="1100" rx="26" fill="url(#background)"/>
  <text x="42" y="46" class="sans eyebrow">THE TICKET IS THE INTERFACE</text>
  <text x="42" y="84" class="sans diagram-title">From intent to evidence</text>

  <rect x="32" y="116" width="736" height="260" rx="20" fill="#131d2a" stroke="#30445a" stroke-width="2"/>
  <circle cx="70" cy="158" r="21" fill="#7dd3b0"/>
  <text x="70" y="166" class="sans" fill="#10251e" font-size="21" font-weight="800" text-anchor="middle">1</text>
  <text x="106" y="167" class="sans phase-title">Shape the work</text>
  <text x="106" y="195" class="sans phase-copy">Agree on scope, risk, boundaries, and manual gates.</text>

  <rect x="58" y="230" width="190" height="94" rx="15" fill="#202c3a" stroke="#46596e"/>
  <circle cx="83" cy="261" r="9" fill="#f5b96b"/>
  <text x="101" y="268" class="sans card-title">Human intent</text>
  <text x="78" y="299" class="sans card-copy">Goals + constraints</text>

  <rect x="305" y="230" width="190" height="94" rx="15" fill="#202c3a" stroke="#46596e"/>
  <circle cx="330" cy="261" r="9" fill="#8bb8f4"/>
  <text x="348" y="268" class="sans card-title">Explore</text>
  <text x="325" y="299" class="sans card-copy">Code + docs + history</text>

  <rect x="552" y="220" width="190" height="114" rx="17" fill="url(#ticket)" stroke="#5687ad" stroke-width="2"/>
  <text x="647" y="255" class="sans card-copy" text-anchor="middle">WIP TICKET</text>
  <text x="647" y="284" class="sans card-title" text-anchor="middle">Shared plan</text>
  <text x="647" y="312" class="sans card-copy" text-anchor="middle">Tasks + gates</text>

  <path d="M248 277h57" class="flow"/>
  <path d="M495 277h57" class="flow"/>
  <text x="400" y="352" class="sans note" text-anchor="middle">Repeat this row until the plan looks credible.</text>

  <rect x="32" y="398" width="736" height="260" rx="20" fill="#131d2a" stroke="#30445a" stroke-width="2"/>
  <circle cx="70" cy="440" r="21" fill="#7dd3b0"/>
  <text x="70" y="448" class="sans" fill="#10251e" font-size="21" font-weight="800" text-anchor="middle">2</text>
  <text x="106" y="449" class="sans phase-title">Execute</text>
  <text x="106" y="477" class="sans phase-copy">Let the agent prepare reversible work.</text>

  <rect x="58" y="512" width="190" height="94" rx="16" fill="url(#ticket)" stroke="#5687ad" stroke-width="2"/>
  <text x="153" y="547" class="sans card-title" text-anchor="middle">Ticket tasks</text>
  <text x="153" y="578" class="sans card-copy" text-anchor="middle">Clear ownership</text>

  <rect x="305" y="512" width="190" height="94" rx="15" fill="#202c3a" stroke="#46596e"/>
  <text x="400" y="547" class="sans card-title" text-anchor="middle">Draft MRs</text>
  <text x="400" y="578" class="sans card-copy" text-anchor="middle">Code + config + docs</text>

  <rect x="552" y="512" width="190" height="94" rx="15" fill="#202c3a" stroke="#46596e"/>
  <text x="647" y="547" class="sans card-title" text-anchor="middle">Evidence</text>
  <text x="647" y="578" class="sans card-copy" text-anchor="middle">Tests + CI + review</text>

  <path d="M248 559h57" class="flow"/>
  <path d="M495 559h57" class="flow"/>
  <text x="400" y="634" class="sans note" text-anchor="middle">Keep the ticket current as each draft changes.</text>

  <rect x="32" y="680" width="736" height="374" rx="20" fill="#131d2a" stroke="#30445a" stroke-width="2"/>
  <circle cx="70" cy="722" r="21" fill="#7dd3b0"/>
  <text x="70" y="730" class="sans" fill="#10251e" font-size="21" font-weight="800" text-anchor="middle">3</text>
  <text x="106" y="731" class="sans phase-title">Review and steer</text>
  <text x="106" y="759" class="sans phase-copy">Review, revise, then pass through human gates.</text>

  <rect x="58" y="796" width="190" height="94" rx="15" fill="#202c3a" stroke="#46596e"/>
  <circle cx="83" cy="827" r="9" fill="#f5b96b"/>
  <text x="101" y="834" class="sans card-title">Human review</text>
  <text x="78" y="865" class="sans card-copy">Questions + decisions</text>

  <rect x="305" y="796" width="190" height="94" rx="15" fill="#202c3a" stroke="#46596e"/>
  <circle cx="330" cy="827" r="9" fill="#8bb8f4"/>
  <text x="348" y="834" class="sans card-title">AI edits</text>
  <text x="325" y="865" class="sans card-copy">Code + ticket state</text>

  <rect x="552" y="796" width="190" height="94" rx="15" fill="#382b23" stroke="#8c6649" stroke-width="2"/>
  <text x="647" y="834" class="sans card-title" text-anchor="middle">Ready?</text>
  <text x="647" y="865" class="sans card-copy" text-anchor="middle">Human decision</text>

  <path d="M248 843h57" class="flow"/>
  <path d="M495 843h57" class="flow"/>

  <rect x="88" y="928" width="180" height="66" rx="15" fill="#2b2525" stroke="#765858"/>
  <text x="178" y="956" class="sans gate-title" text-anchor="middle">MERGE</text>
  <text x="178" y="980" class="sans card-copy" text-anchor="middle">Approve</text>

  <rect x="310" y="928" width="180" height="66" rx="15" fill="#2b2525" stroke="#765858"/>
  <text x="400" y="956" class="sans gate-title" text-anchor="middle">DEPLOY</text>
  <text x="400" y="980" class="sans card-copy" text-anchor="middle">Cut over</text>

  <rect x="532" y="928" width="180" height="66" rx="15" fill="#2b2525" stroke="#765858"/>
  <text x="622" y="956" class="sans gate-title" text-anchor="middle">VALIDATE</text>
  <text x="622" y="980" class="sans card-copy" text-anchor="middle">Observe</text>

  <path d="M647 890v20H178v18" class="flow"/>
  <path d="M647 890v20H400v18" class="flow"/>
  <path d="M647 890v20H622v18" class="flow"/>

  <text x="400" y="1031" class="sans note" text-anchor="middle">If review changes the assumptions, return to Phase 1.</text>
  <text x="42" y="1080" class="sans note">The agent prepares. A person controls release.</text>
</svg>
