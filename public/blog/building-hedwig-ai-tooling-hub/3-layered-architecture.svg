<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1010" role="img" aria-labelledby="title desc">
  <title id="title">Three-layer modular architecture</title>
  <desc id="desc">A vertical stack shows independent applications above reusable platform services and stable core infrastructure, with dependencies pointing downward.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#56d6e5"/></marker></defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#56d6e5;font-size:18px;font-weight:800;letter-spacing:2px}.h{fill:#fff8e8;font-size:34px;font-weight:800}.n{fill:#fff8e8;font-size:25px;font-weight:800}.b{fill:#c9d6df;font-size:19px}.dark{fill:#0b2239;font-size:19px;font-weight:750}</style>
  <rect width="800" height="1010" rx="28" fill="#091b2d"/><text x="48" y="58" class="k">LAYERED ARCHITECTURE</text><text x="48" y="105" class="h">Dependencies point downward</text>
  <rect x="48" y="155" width="704" height="230" rx="22" fill="#112b43" stroke="#31516b" stroke-width="2"/>
  <text x="78" y="204" class="k">APPLICATIONS</text><text x="78" y="247" class="n">One slice per user workflow</text><text x="78" y="286" class="b">Own interface / contract / outcome</text>
  <rect x="78" y="318" width="190" height="46" rx="12" fill="#193b55"/><rect x="305" y="318" width="190" height="46" rx="12" fill="#193b55"/><rect x="532" y="318" width="190" height="46" rx="12" fill="#193b55"/>
  <text x="173" y="348" text-anchor="middle" class="b">Tool A</text><text x="400" y="348" text-anchor="middle" class="b">Tool B</text><text x="627" y="348" text-anchor="middle" class="b">Tool C</text>
  <path d="M400 385v61" stroke="#56d6e5" stroke-width="4" marker-end="url(#a)"/>
  <rect x="48" y="455" width="704" height="225" rx="22" fill="#12334b" stroke="#56d6e5" stroke-width="2"/>
  <text x="78" y="504" class="k">PLATFORM</text><text x="78" y="547" class="n">Reusable product capabilities</text><text x="78" y="586" class="b">Agent runtime / typed tools / persistence</text><text x="78" y="621" class="b">Feature controls / shared UI / team config</text>
  <path d="M400 680v61" stroke="#56d6e5" stroke-width="4" marker-end="url(#a)"/>
  <rect x="48" y="750" width="704" height="178" rx="22" fill="#f4ad62"/>
  <text x="78" y="800" class="dark">CORE</text><text x="78" y="843" class="dark">Stable operational foundations</text><text x="78" y="884" class="dark">Lifecycle / identity / config / health / transport</text>
  <text x="400" y="974" text-anchor="middle" class="b">Applications do not depend on one another.</text>
</svg>
