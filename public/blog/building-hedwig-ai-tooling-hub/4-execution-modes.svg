<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Three execution modes selected by the shape of the work</title>
  <desc id="desc">Interactive, background, and isolated workspace modes are compared vertically by duration, steering, and output.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{fill:#56d6e5;font-size:18px;font-weight:800;letter-spacing:2px}.h{fill:#fff8e8;font-size:34px;font-weight:800}.n{fill:#fff8e8;font-size:26px;font-weight:800}.b{fill:#c9d6df;font-size:19px}.chip{fill:#0b2239;font-size:18px;font-weight:800}</style>
  <rect width="800" height="1080" rx="28" fill="#091b2d"/><text x="48" y="58" class="k">EXECUTION MODES</text><text x="48" y="105" class="h">Match the runtime to the job</text>
  <g transform="translate(48 150)"><rect width="704" height="244" rx="22" fill="#112b43" stroke="#31516b" stroke-width="2"/><circle cx="52" cy="55" r="27" fill="#56d6e5"/><text x="52" y="63" text-anchor="middle" class="chip">1</text><text x="98" y="64" class="n">Interactive</text><text x="30" y="112" class="b">Short exchange with immediate human steering.</text><rect x="30" y="145" width="190" height="54" rx="13" fill="#193b55"/><text x="125" y="179" text-anchor="middle" class="b">Minutes</text><rect x="242" y="145" width="200" height="54" rx="13" fill="#193b55"/><text x="342" y="179" text-anchor="middle" class="b">Live guidance</text><rect x="464" y="145" width="210" height="54" rx="13" fill="#193b55"/><text x="569" y="179" text-anchor="middle" class="b">Answer</text></g>
  <g transform="translate(48 425)"><rect width="704" height="244" rx="22" fill="#112b43" stroke="#31516b" stroke-width="2"/><circle cx="52" cy="55" r="27" fill="#9bdb8f"/><text x="52" y="63" text-anchor="middle" class="chip">2</text><text x="98" y="64" class="n">Background task</text><text x="30" y="112" class="b">Bounded asynchronous work with a clear result.</text><rect x="30" y="145" width="190" height="54" rx="13" fill="#193b55"/><text x="125" y="179" text-anchor="middle" class="b">Longer</text><rect x="242" y="145" width="200" height="54" rx="13" fill="#193b55"/><text x="342" y="179" text-anchor="middle" class="b">Progress events</text><rect x="464" y="145" width="210" height="54" rx="13" fill="#193b55"/><text x="569" y="179" text-anchor="middle" class="b">Report</text></g>
  <g transform="translate(48 700)"><rect width="704" height="244" rx="22" fill="#12334b" stroke="#f4ad62" stroke-width="2"/><circle cx="52" cy="55" r="27" fill="#f4ad62"/><text x="52" y="63" text-anchor="middle" class="chip">3</text><text x="98" y="64" class="n">Isolated workspace</text><text x="30" y="112" class="b">Durable work with files, logs, previews, and follow-up.</text><rect x="30" y="145" width="190" height="54" rx="13" fill="#193b55"/><text x="125" y="179" text-anchor="middle" class="b">Persistent</text><rect x="242" y="145" width="200" height="54" rx="13" fill="#193b55"/><text x="342" y="179" text-anchor="middle" class="b">Review + steer</text><rect x="464" y="145" width="210" height="54" rx="13" fill="#193b55"/><text x="569" y="179" text-anchor="middle" class="b">Artifacts</text></g>
  <text x="400" y="1015" text-anchor="middle" class="n">Duration is not the only decision.</text><text x="400" y="1048" text-anchor="middle" class="b">Steering and output shape matter too.</text>
</svg>
