<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" font-family="Inter, system-ui, sans-serif" style="background:#1a1b26">
  <defs>
    <marker id="handoff-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7aa2f7" />
    </marker>
    <marker id="notify-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e0af68" />
    </marker>
  </defs>

  <!-- Parent session (left) -->
  <rect x="40" y="80" width="300" height="150" rx="12" fill="#1f2a44" stroke="#7aa2f7" stroke-width="2.5" />
  <text x="65" y="118" font-size="17" font-weight="700" fill="#7aa2f7" letter-spacing="0.5">PARENT SESSION</text>
  <text x="65" y="148" font-size="13.5" fill="#c0caf5">fast model</text>
  <text x="65" y="172" font-size="13.5" fill="#c0caf5">always free to answer</text>
  <text x="65" y="196" font-size="13.5" fill="#c0caf5">handles "quick questions" only</text>

  <!-- Background child agent (right) -->
  <rect x="420" y="80" width="300" height="150" rx="12" fill="#4a3820" stroke="#e0af68" stroke-width="2.5" />
  <text x="445" y="112" font-size="17" font-weight="700" fill="#e0af68" letter-spacing="0.5">BACKGROUND</text>
  <text x="445" y="132" font-size="17" font-weight="700" fill="#e0af68" letter-spacing="0.5">CHILD AGENT</text>
  <text x="445" y="160" font-size="13.5" fill="#c0caf5">heavier model</text>
  <text x="445" y="184" font-size="13.5" fill="#c0caf5">the long thing: refactor,</text>
  <text x="445" y="204" font-size="13.5" fill="#c0caf5">migration, multi-file change</text>

  <!-- Hands off the long task: parent -> child -->
  <path d="M 340,140 C 375,132 385,132 420,140" fill="none" stroke="#7aa2f7" stroke-width="2.5" marker-end="url(#handoff-arrow)" />
  <text x="380" y="118" text-anchor="middle" font-size="11.5" fill="#7aa2f7">hands off the long task</text>

  <!-- Notifies when it needs you: child -> parent -->
  <path d="M 420,180 C 385,188 375,188 340,180" fill="none" stroke="#e0af68" stroke-width="2.5" marker-end="url(#notify-arrow)" />
  <text x="380" y="210" text-anchor="middle" font-size="11.5" fill="#e0af68">notifies when it needs you</text>
</svg>
