<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title description">
  <title id="title">Configurable coding-agent worker autonomy</title>
  <desc id="description">Four autonomy modes progress from supervised to checkpointed, draft pull request, and outcome-only. Manager involvement decreases from left to right while the human merge gate remains fixed.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#080d16"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5b96b"/>
      <stop offset="0.52" stop-color="#8bb8f4"/>
      <stop offset="1" stop-color="#7dd3b0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#8ea6ba"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #7dd3b0; font-size: 15px; font-weight: 750; letter-spacing: 2px; }
      .heading { fill: #f4f0e8; font-size: 30px; font-weight: 760; }
      .card-title { fill: #f4f0e8; font-size: 20px; font-weight: 730; }
      .copy { fill: #afbdca; font-size: 14px; }
      .tiny { fill: #899aab; font-size: 12px; }
    </style>
  </defs>

  <rect width="1000" height="470" rx="28" fill="url(#background)"/>
  <text x="42" y="48" class="sans eyebrow">MANAGER-WORKER CONTRACT</text>
  <text x="42" y="87" class="sans heading">Autonomy is configured per task</text>

  <text x="54" y="133" class="sans copy">More manager involvement</text>
  <text x="946" y="133" class="sans copy" text-anchor="end">More worker autonomy</text>
  <rect x="54" y="148" width="892" height="8" rx="4" fill="url(#spectrum)"/>

  <g>
    <rect x="54" y="188" width="205" height="151" rx="18" fill="#302720" stroke="#9c714a" stroke-width="2"/>
    <circle cx="84" cy="221" r="11" fill="#f5b96b"/>
    <text x="105" y="228" class="sans card-title">Supervised</text>
    <text x="75" y="263" class="sans copy">Propose before edits</text>
    <text x="75" y="289" class="sans copy">Ask frequent questions</text>
    <text x="75" y="315" class="sans copy">Pause at decisions</text>
  </g>

  <g>
    <rect x="283" y="188" width="205" height="151" rx="18" fill="#242d3b" stroke="#677d96" stroke-width="2"/>
    <circle cx="313" cy="221" r="11" fill="#b8a5e8"/>
    <text x="334" y="228" class="sans card-title">Checkpointed</text>
    <text x="304" y="263" class="sans copy">Implement one slice</text>
    <text x="304" y="289" class="sans copy">Commit and request review</text>
    <text x="304" y="315" class="sans copy">Continue when unlocked</text>
  </g>

  <g>
    <rect x="512" y="188" width="205" height="151" rx="18" fill="#1d3042" stroke="#5e91b8" stroke-width="2"/>
    <circle cx="542" cy="221" r="11" fill="#8bb8f4"/>
    <text x="563" y="228" class="sans card-title">Draft PR</text>
    <text x="533" y="263" class="sans copy">Implement and test</text>
    <text x="533" y="289" class="sans copy">Open a review checkpoint</text>
    <text x="533" y="315" class="sans copy">Revise in same session</text>
  </g>

  <g>
    <rect x="741" y="188" width="205" height="151" rx="18" fill="#15332e" stroke="#4f9b82" stroke-width="2"/>
    <circle cx="771" cy="221" r="11" fill="#7dd3b0"/>
    <text x="792" y="228" class="sans card-title">Outcome-only</text>
    <text x="762" y="263" class="sans copy">Run to completion</text>
    <text x="762" y="289" class="sans copy">Escalate only blockers</text>
    <text x="762" y="315" class="sans copy">Report evidence when done</text>
  </g>

  <path d="M157 339v48h686v-48" fill="none" stroke="#8ea6ba" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="340" y="378" width="320" height="56" rx="16" fill="#2b2525" stroke="#765858" stroke-width="2"/>
  <text x="500" y="403" class="sans card-title" text-anchor="middle">Human merge gate stays fixed</text>
  <text x="500" y="423" class="sans tiny" text-anchor="middle">Autonomy changes execution, not final authority</text>

  <text x="42" y="454" class="sans tiny">A worker can move between modes as uncertainty falls or risk increases.</text>
</svg>
