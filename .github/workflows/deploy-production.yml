name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Production has its own concurrency group. GitHub keeps only one pending run
# per group, so sharing a group with PR runs let a PR's close cleanup replace
# (cancel) the queued production deploy for the merge commit. Non-force pushes
# with retries keep concurrent gh-pages writes from overwriting each other,
# and the clean step below preserves previews/.
concurrency:
  group: gh-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: |
          rm -rf docs
          npm run build

      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          clean: true
          clean-exclude: |
            previews
            previews/**
          force: false
          attempt-limit: 10
