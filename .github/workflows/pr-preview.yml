name: PR preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        env:
          PREVIEW_PATH: /previews/pr-${{ github.event.pull_request.number }}/
        run: |
          rm -rf docs
          npx vite build --base="$PREVIEW_PATH"
          cp docs/index.html docs/404.html
          # The deploy action never deletes files named CNAME or .nojekyll,
          # so shipping them into a preview folder would make close-cleanup
          # leave a permanent stale directory behind. They belong only at
          # the gh-pages root, which the production deploy provides.
          rm -f docs/CNAME docs/.nojekyll

      - name: Deploy preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          target-folder: previews/pr-${{ github.event.pull_request.number }}
          clean: true
          # The PR screenshots workflow publishes into screenshots/ inside this
          # preview folder; preview redeploys must not delete it. The cleanup
          # job below intentionally has no exclude so PR close removes it.
          clean-exclude: screenshots/**
          force: false
          attempt-limit: 10

      - name: Add preview link to pull request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const previewUrl = `https://leoncheng.dev/previews/pr-${context.issue.number}/`;
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7);
            const updatedAt = new Date().toISOString().replace('T', ' ').slice(0, 16);
            const body = [
              marker,
              `PR preview: ${previewUrl}`,
              '',
              `_Deployed at ${shortSha}, updated ${updatedAt} UTC. This preview refreshes on every push and is removed when the pull request closes._`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create empty deployment directory
        run: mkdir preview-cleanup

      - name: Remove preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: preview-cleanup
          branch: gh-pages
          target-folder: previews/pr-${{ github.event.pull_request.number }}
          clean: true
          force: false
          attempt-limit: 10
