name: PR screenshots

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: write
  pull-requests: write

# Writes to the same gh-pages branch as the production and preview deploys,
# so it must share their concurrency group and never force-push.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  screenshots:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse screenshot paths from pull request description
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? '';

            // Prefer the explicitly marked CI region so the machine-parsed
            // block is isolated from the rest of the description. When both
            // markers are present, only that region is searched; otherwise
            // fall back to scanning the whole body (backward compatible).
            // Markers only count when they sit alone on their own line, so
            // prose that merely mentions the marker strings is ignored.
            const startMarker = /^\s*<!--\s*ci:screenshots:start\s*-->\s*$/m;
            const region = body.match(/^\s*<!--\s*ci:screenshots:start\s*-->\s*$([\s\S]*?)^\s*<!--\s*ci:screenshots:end\s*-->\s*$/m);
            if (startMarker.test(body) && !region) {
              core.setFailed('Found a ci:screenshots:start marker without a matching <!-- ci:screenshots:end --> marker on its own line in the pull request description.');
              return;
            }
            const searchText = region ? region[1] : body;
            if (region) {
              core.info('Parsing screenshots from the ci:screenshots marker region.');
            }

            const match = searchText.match(/```screenshots\s*\n([\s\S]*?)```/);
            const targets = [];

            if (match) {
              for (const rawLine of match[1].split('\n')) {
                const line = rawLine.trim();
                if (!line || line.startsWith('#')) {
                  continue;
                }
                const parsed = line.match(/^((?:with-full:)?\/\S*)(?: -- (\S.*))?$/);
                if (!parsed) {
                  core.setFailed(`Invalid screenshot line "${line}". Expected "[with-full:]/path[ -- Title]" with a path that starts with "/" and contains no whitespace.`);
                  return;
                }
                targets.push({ arg: parsed[1], title: parsed[2]?.trim() ?? null });
              }
            }

            core.setOutput('targets', JSON.stringify(targets));
            core.setOutput('has_paths', targets.length > 0 ? 'true' : 'false');
            core.info(targets.length > 0 ? `Screenshot targets: ${targets.map((t) => t.arg).join(' ')}` : 'No ```screenshots block found in the pull request description.');

      - name: Set up Node.js
        if: steps.parse.outputs.has_paths == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.parse.outputs.has_paths == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.parse.outputs.has_paths == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build app
        if: steps.parse.outputs.has_paths == 'true'
        run: |
          rm -rf docs
          npm run build

      - name: Capture screenshots
        if: steps.parse.outputs.has_paths == 'true'
        env:
          SCREENSHOT_TARGETS: ${{ steps.parse.outputs.targets }}
        run: node scripts/ci-screenshots.mjs

      - name: Publish screenshots to gh-pages
        if: steps.parse.outputs.has_paths == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: screenshot-output
          branch: gh-pages
          target-folder: previews/pr-${{ github.event.pull_request.number }}/screenshots
          clean: true
          force: false
          attempt-limit: 10

      - name: Update screenshots comment on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-screenshots -->';
            const hasPaths = '${{ steps.parse.outputs.has_paths }}' === 'true';
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7);
            const baseUrl = `https://leoncheng.dev/previews/pr-${context.issue.number}/screenshots`;

            const lines = [marker, '## PR screenshots', ''];
            if (hasPaths) {
              const manifest = JSON.parse(fs.readFileSync('screenshot-output/manifest.json', 'utf8'));
              for (const entry of manifest) {
                const label = entry.title ?? entry.path;
                lines.push(entry.title ? `### ${entry.title}` : `### \`${entry.path}\``);
                lines.push('');
                if (entry.title) {
                  lines.push(`\`${entry.path}\``);
                  lines.push('');
                }
                lines.push(`![${label}](${baseUrl}/${entry.file}?sha=${shortSha})`);
                lines.push('');
                if (entry.fullFile) {
                  lines.push(`<details><summary>📸 Full page — <code>${entry.path}</code> <em>(click to expand)</em></summary>`);
                  lines.push('');
                  lines.push(`![${label} (full page)](${baseUrl}/${entry.fullFile}?sha=${shortSha})`);
                  lines.push('');
                  lines.push('</details>');
                  lines.push('');
                }
              }
              const updatedAt = new Date().toISOString().replace('T', ' ').slice(0, 16);
              lines.push(`_Captured at ${shortSha}, updated ${updatedAt} UTC. Screenshots refresh on every push and description edit, and are removed when the pull request closes._`);
            } else {
              lines.push('No screenshots requested. Add a ```screenshots fenced block to the pull request description with one `[with-full:]/path[ -- Title]` line per page to capture. Prefix a path with `with-full:` to also capture the entire scroll height; add ` -- Title` to label what the capture shows. Prefer wrapping the block between `<!-- ci:screenshots:start -->` and `<!-- ci:screenshots:end -->` markers under a "## CI: screenshots" heading so the CI-parsed region stands apart from prose.');
            }
            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else if (hasPaths) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
